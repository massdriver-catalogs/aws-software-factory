name: lambda-function
description: >-
  A Lambda function behind an HTTP API, optionally with a DynamoDB table. Runs a built-in
  placeholder until it's given a container image, so the routes answer from the first deploy.
source_url: https://github.com/massdriver-catalogs/aws-software-factory/tree/main/bundles/lambda-function
version: 0.0.0

params:
  examples:
    - __name: Lowest cost
      image_uri: ""
      routes:
        - ANY /{proxy+}
        - ANY /
      memory_mb: 256
      timeout_seconds: 10
      environment: []
      log_retention_days: 1
    - __name: Production
      image_uri: ""
      routes:
        - ANY /{proxy+}
        - ANY /
      memory_mb: 1024
      timeout_seconds: 29
      environment: []
      log_retention_days: 30
  required:
    - image_uri
    - routes
    - memory_mb
    - timeout_seconds
    - environment
    - log_retention_days
  properties:
    image_uri:
      title: Container image
      description: >-
        An arm64 image in this account's ECR, by tag or digest. Leave empty to run the built-in
        placeholder, which echoes the request and reports the table it's connected to.
      type: string
      default: ""
      pattern: ^(|[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9._/-]+(:[A-Za-z0-9._-]+|@sha256:[a-f0-9]{64}))$
      message:
        pattern: "An ECR image like 123456789012.dkr.ecr.us-east-1.amazonaws.com/app:tag, or empty."
    routes:
      title: Routes
      description: >-
        `METHOD /path` pairs this function answers on the API. `{name}` captures a path segment and
        `{proxy+}` the rest of the path. Two functions can't claim the same route.
      type: array
      minItems: 1
      uniqueItems: true
      default:
        - ANY /{proxy+}
        - ANY /
      items:
        type: string
        pattern: ^(ANY|GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS) /[A-Za-z0-9._~{}+/-]*$
        message:
          pattern: "A method and path, like GET /items/{id} or ANY /{proxy+}."
    memory_mb:
      title: Memory (MB)
      description: >-
        CPU scales with memory. ***Billed per GB-second while running***, so doubling memory doubles
        the rate but often halves the time.
      type: integer
      default: 256
      enum:
        - 128
        - 256
        - 512
        - 1024
        - 2048
        - 4096
    timeout_seconds:
      title: Timeout (seconds)
      description: The API gives up after 30 seconds, so longer timeouts don't help requests through it.
      type: integer
      default: 10
      minimum: 1
      maximum: 29
    environment:
      title: Environment variables
      description: >-
        Plain configuration only; values are visible to anyone who can view this function. When a
        table is connected, `TABLE_NAME` is set for you.
      type: array
      default: []
      items:
        type: object
        required:
          - name
          - value
        properties:
          name:
            title: Name
            type: string
            pattern: ^[A-Za-z][A-Za-z0-9_]*$
            message:
              pattern: "Letters, digits and underscores, starting with a letter."
          value:
            title: Value
            type: string
    table_access:
      title: Table access
      description: Which of the connected table's policies this function gets. Defaults to read/write.
      type: string
      $md.enum:
        connection: storage
        options: .policies
        value: .arn
        label: .name
    log_retention_days:
      title: Log retention (days)
      description: "***Billed per GB ingested and stored.***"
      type: integer
      default: 1
      enum:
        - 1
        - 7
        - 30
        - 90

dependencies:
  aws_authentication:
    resource_type: aws-iam-role@0.0.0
    required: true
  api:
    resource_type: aws-http-api@0.0.0
    required: true
  storage:
    resource_type: aws-dynamodb-table@0.0.0
    required: false

resources: {}

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - image_uri
    - routes
    - memory_mb
    - timeout_seconds
    - environment
    - table_access
    - log_retention_days
    - "*"
  environment:
    items:
      ui:order:
        - name
        - value
