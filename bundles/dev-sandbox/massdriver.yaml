name: dev-sandbox
description: >-
  A disposable cloud VM for one developer, with coding agents already pointed at the AI Platform.
  Reached through Session Manager, with no inbound ports and no cloud credentials beyond its own.
source_url: https://github.com/massdriver-catalogs/aws-software-factory/tree/main/bundles/dev-sandbox
version: 0.0.0
provides: [runtime]

params:
  examples:
    - __name: Lowest cost
      size: light
      chip: arm
      workspace_gb: 20
      network_mode: public
      idle_stop: 30m
      nightly_stop: "20:00"
      timezone: America/Los_Angeles
      agents: [opencode]
      autonomy: free
      languages: [python, node]
      dotfiles_repo: ""
      browser_access: false
      preview_port: 5173
      goal: ""
      goal_every: once
      aws_access: none
    - __name: In the browser
      size: light
      chip: arm
      workspace_gb: 20
      network_mode: private
      idle_stop: 30m
      nightly_stop: "20:00"
      timezone: America/Los_Angeles
      agents: [opencode]
      autonomy: free
      languages: [python, node]
      dotfiles_repo: ""
      browser_access: true
      preview_port: 5173
      goal: ""
      goal_every: once
      aws_access: none
    - __name: Heavy builds
      size: heavy
      chip: arm
      workspace_gb: 100
      network_mode: private
      idle_stop: 1h
      nightly_stop: "22:00"
      timezone: America/Los_Angeles
      agents: [opencode, claude-code]
      autonomy: free
      languages: [python, node, go]
      dotfiles_repo: ""
      browser_access: false
      preview_port: 5173
      goal: ""
      goal_every: once
      aws_access: none
  required:
    - size
    - chip
    - workspace_gb
    - network_mode
    - idle_stop
    - nightly_stop
    - timezone
    - agents
    - autonomy
    - languages
  properties:
    size:
      title: Size
      description: Light runs agents, docker and normal builds comfortably. Go bigger for large monorepos or parallel agents.
      type: string
      default: light
      oneOf:
        - const: light
          title: Light — 2 vCPU, 4 GB (~$25/month if never stopped)
        - const: standard
          title: Standard — 2 vCPU, 8 GB (~$49/month if never stopped)
        - const: heavy
          title: Heavy — 4 vCPU, 16 GB (~$98/month if never stopped)
    chip:
      title: Chip
      description: >-
        ARM is cheaper and runs almost everything. Intel is ~20% more and only needed for tools
        without ARM builds. Changing it rebuilds the VM; the workspace disk is kept.
      type: string
      default: arm
      oneOf:
        - const: arm
          title: ARM (Graviton)
        - const: intel
          title: Intel
    workspace_gb:
      title: Workspace disk (GB)
      description: >-
        Mounted at /workspace and kept when the VM is rebuilt. Can grow, never shrink.
        ***~$0.08/GB-month, billed even while stopped.***
      type: integer
      default: 20
      minimum: 20
      maximum: 500
    network_mode:
      title: Network
      description: >-
        Either way nothing can connect in; you reach it through Session Manager.
      type: string
      default: public
      oneOf:
        - const: public
          title: Public IP, no inbound — ~$4/month for the address, no NAT needed
        - const: private
          title: Private — goes out through the VPC's egress, which must be on
    browser_access:
      title: Browser access
      description: >-
        opencode in a browser tab, plus a preview URL for a dev server running in the sandbox,
        both over HTTPS through CloudFront and behind a password. Needs **Private** network mode
        and opencode among the coding agents. ***CloudFront's free tier covers a developer's use;
        beyond it, ~$0.085/GB.***
      type: boolean
      default: false
    preview_port:
      title: Preview port
      description: >-
        The port your dev server listens on, bound to 0.0.0.0 (e.g. `npm run dev -- --host`).
        Changing it recreates the preview URL.
      type: integer
      default: 5173
      minimum: 1024
      maximum: 65535
      not:
        const: 4096
      message:
        not: "4096 is taken by opencode's browser interface."
    idle_stop:
      title: Stop when idle for
      description: >-
        Stops the VM when CPU stays near zero. ***A stopped VM costs only its disks.***
      type: string
      default: 30m
      oneOf:
        - const: 30m
          title: 30 minutes
        - const: 1h
          title: 1 hour
        - const: 2h
          title: 2 hours
        - const: never
          title: Never
    nightly_stop:
      title: Stop every night at
      description: A backstop for sessions left open. ***Off means it runs all night.***
      type: string
      default: "20:00"
      oneOf:
        - const: "off"
          title: "Off"
        - const: "18:00"
          title: 6 pm
        - const: "20:00"
          title: 8 pm
        - const: "22:00"
          title: 10 pm
        - const: "00:00"
          title: Midnight
    timezone:
      title: Timezone
      type: string
      default: America/Los_Angeles
      enum:
        - America/Los_Angeles
        - America/Denver
        - America/Chicago
        - America/New_York
        - America/Sao_Paulo
        - Europe/London
        - Europe/Berlin
        - Asia/Kolkata
        - Asia/Singapore
        - Asia/Tokyo
        - Australia/Sydney
        - UTC
    agents:
      title: Coding agents
      description: Each one is set up to use the AI Platform when it's connected.
      type: array
      uniqueItems: true
      minItems: 1
      default: [opencode]
      items:
        type: string
        oneOf:
          - const: opencode
            title: opencode
          - const: claude-code
            title: Claude Code
    autonomy:
      title: How much do agents do on their own?
      description: >-
        The VM is disposable and holds no cloud credentials, so letting agents run freely only
        risks the VM itself.
      type: string
      default: free
      oneOf:
        - const: free
          title: Run freely inside the sandbox
        - const: ask
          title: Ask before editing files or running commands
    languages:
      title: Languages to install
      description: Installed with mise. Agents can add others themselves.
      type: array
      uniqueItems: true
      default: [python, node]
      items:
        type: string
        oneOf:
          - const: python
            title: Python
          - const: node
            title: Node.js
          - const: go
            title: Go
          - const: java
            title: Java
          - const: rust
            title: Rust
    dotfiles_repo:
      title: Dotfiles repository
      description: A public git URL. It's cloned into your home directory and its install.sh is run on first boot.
      type: string
      default: ""
      pattern: ^(|https://[^\s]+)$
      message:
        pattern: "Must be an https:// git URL, or empty."
    git_name:
      title: Your name for commits
      description: Shown as the author of commits made in the sandbox. Defaults to the sandbox's name.
      type: string
      default: ""
      maxLength: 100
    git_email:
      title: Your email for commits
      description: >-
        Links commits to your GitHub account when it matches an address on that account. Defaults
        to an address that links to no one.
      type: string
      default: ""
      pattern: ^(|[^@\s]+@[^@\s]+)$
      message:
        pattern: "An email address, or empty."
    goal:
      title: Goal
      description: >-
        A standing task for the agent. It runs headless in /workspace, with every tool and permission
        the sandbox has, and writes each run's output to /workspace/.goal/runs. Leave empty for an
        interactive sandbox.
      type: string
      default: ""
      maxLength: 8000
    goal_every:
      title: Work on the goal
      description: >-
        Once runs it after boot and again whenever the goal changes. Any repeat turns off the idle
        and nightly stops, so the VM keeps running. ***A VM that never stops bills every hour.***
      type: string
      default: once
      oneOf:
        - const: once
          title: Once
        - const: 5m
          title: Every 5 minutes
        - const: 15m
          title: Every 15 minutes
        - const: 1h
          title: Every hour
        - const: 6h
          title: Every 6 hours
        - const: 1d
          title: Every day
    aws_access:
      title: AWS access for agents
      description: >-
        What the sandbox can see in this AWS account, beyond its own secrets. It can never change
        anything.
      type: string
      default: none
      oneOf:
        - const: none
          title: None
        - const: observe
          title: Alarms, metrics, logs and resource lists
        - const: read_only
          title: Read everything, including S3 objects and table data
    massdriver_groups:
      title: Massdriver access for agents
      description: >-
        Groups whose permissions the sandbox's agents get in Massdriver, through a service account
        made for this sandbox. Needs a Massdriver Service Account credential on this environment.
        Leave empty to keep the Massdriver tools off.
      type: array
      uniqueItems: true
      default: []
      items:
        type: string
        $md.list:
          resource: group

dependencies:
  aws_authentication:
    resource_type: aws-iam-role@0.0.0
    required: true
  network:
    resource_type: aws-vpc@0.0.0
    required: true
  llm:
    resource_type: llm-endpoint@0.0.0
    required: false
  github:
    resource_type: github-app@0.0.0
    required: false
  massdriver:
    resource_type: massdriver-service-account@0.0.0
    required: false

resources:
  access:
    resource_type: dev-sandbox-access@0.0.0
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - size
    - chip
    - workspace_gb
    - network_mode
    - idle_stop
    - nightly_stop
    - timezone
    - agents
    - autonomy
    - languages
    - browser_access
    - preview_port
    - dotfiles_repo
    - git_name
    - git_email
    - goal
    - goal_every
    - aws_access
    - massdriver_groups
    - "*"
  workspace_gb:
    ui:widget: updown
  agents:
    ui:widget: checkboxes
  languages:
    ui:widget: checkboxes
  preview_port:
    ui:widget: updown
  goal:
    ui:widget: textarea
    ui:options:
      rows: 8
