name: github-repo
description: >-
  A GitHub repository with a working build pipeline. Every push to the default branch builds an
  arm64 container image, and pushes it to ECR when a container repository is connected.
source_url: https://github.com/massdriver-catalogs/aws-software-factory/tree/main/bundles/github-repo
version: 0.0.0

params:
  examples:
    - __name: Private app
      monthly_budget: 5
      repository_name: todoapp
      description: ""
      visibility: private
      seed_starter_files: true
      factory_workflows: true
      adopt_existing_repository: false
      default_branch: main
      release_instance: ""
      release_groups: []
    - __name: Public app
      monthly_budget: 5
      repository_name: todoapp
      description: ""
      visibility: public
      seed_starter_files: true
      factory_workflows: true
      adopt_existing_repository: false
      default_branch: main
      release_instance: ""
      release_groups: []
    - __name: Adopt an existing repository
      monthly_budget: 5
      repository_name: todoapp
      description: ""
      visibility: private
      seed_starter_files: false
      factory_workflows: false
      adopt_existing_repository: true
      default_branch: main
      release_instance: ""
      release_groups: []
  required:
    - repository_name
    - visibility
    - seed_starter_files
    - default_branch
  properties:
    monthly_budget:
      title: Monthly budget (USD)
      description: >-
        What this instance should cost in a month. When Massdriver's cost data goes over it, a
        cheaper configuration is proposed for review.
      type: number
      minimum: 0
      default: 5
    repository_name:
      title: Repository name
      description: >-
        Becomes github.com/<organization>/<name>. Changing it means a new repository.
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[A-Za-z0-9._-]+$
      message:
        pattern: "Letters, digits, dot, underscore and hyphen only."
      $md.immutable: true
    description:
      title: Description
      description: Shown on the repository page.
      type: string
      default: ""
    visibility:
      title: Visibility
      description: "***Private repositories use GitHub Actions minutes, billed beyond the plan's free allowance; public ones build free.*** Anything pushed to a public repository is public for good."
      type: string
      default: private
      oneOf:
        - const: private
          title: Private — only members of the organization
        - const: public
          title: Public — anyone on the internet
    seed_starter_files:
      title: Add a starter app
      description: >-
        Commits a small Lambda container app, its Dockerfile and the build workflow, so the first
        push proves the pipeline. Turn off to import an existing project; then add the workflow
        yourself.
      type: boolean
      default: true
      $md.immutable: true
    factory_workflows:
      title: Add the factory workflows
      description: >-
        Commits `agent.yml` (an `agent` label or a `/agent` comment turns an issue into a pull
        request) and `ai-review.yml` (an AI review on every pull request), and creates the `agent`
        label. Both run on the Software Factory's runners, which need an LLM Endpoint connected;
        without those runners these jobs wait in the queue. Written once, like the starter app.
      type: boolean
      default: true
      $md.immutable: true
    adopt_existing_repository:
      title: Adopt an existing repository
      description: >-
        Take over a repository that already exists in the organization instead of creating one.
        Nothing in it is overwritten, and starter files are skipped; only Release to adds its
        workflow. If it's archived, it's unarchived. Only the first deploy reads this.
      type: boolean
      default: false
      $md.immutable: true
    default_branch:
      title: Default branch
      description: The branch that builds and pushes images.
      type: string
      default: main
      pattern: ^[A-Za-z0-9._/-]+$
      $md.immutable: true
    release_instance:
      title: Release to
      description: >-
        The instance that runs each new image, by ID, like `todoapp-dev-fn`. After a build on the
        default branch pushes, the pipeline deploys it with the new `image_uri`. Needs a container
        repository and a Massdriver Service Account credential on this environment. Leave empty to
        only build.
      type: string
      default: ""
      pattern: ^(|[a-z0-9]+(-[a-z0-9]+){2,})$
      message:
        pattern: "An instance ID like todoapp-dev-fn, or empty."
    release_groups:
      title: Release permissions
      description: >-
        Groups whose permissions the pipeline gets in Massdriver. Pick a group that can deploy the
        instance above.
      type: array
      uniqueItems: true
      default: []
      items:
        type: string
        $md.list:
          resource: group

dependencies:
  aws_authentication:
    resource_type: aws-iam-role@0.0.0
    required: true
  github:
    resource_type: github-app@0.0.0
    required: true
  github_oidc:
    resource_type: aws-github-oidc@0.0.0
    required: false
  registry:
    resource_type: aws-ecr-repository@0.0.0
    required: false
  massdriver:
    resource_type: massdriver-service-account@0.0.0
    required: false

resources:
  repository:
    resource_type: source-repository@0.0.0
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - repository_name
    - description
    - visibility
    - seed_starter_files
    - factory_workflows
    - adopt_existing_repository
    - default_branch
    - release_instance
    - release_groups
    - "*"
