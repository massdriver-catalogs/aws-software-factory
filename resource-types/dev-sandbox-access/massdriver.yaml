name: dev-sandbox-access
version: 0.0.0
label: Dev Sandbox Access

ui:
  connectionOrientation: link

exports:
  - downloadButtonText: Connect script
    fileFormat: sh
    templatePath: ./exports/connect.sh.liquid
    templateLang: liquid

schema:
  title: Dev Sandbox Access
  description: >-
    A role that can only start, and open a session on, one developer sandbox, assumed from the
    identities its instance lists. The connect script turns it into an AWS profile and an
    `ssh <name>` entry.
  type: object
  additionalProperties: false
  required:
    - name
    - region
  properties:
    name:
      title: Name
      description: The sandbox's Name tag, also used as the SSH host and AWS profile name.
      type: string
    region:
      title: Region
      type: string
    role_arn:
      title: Role ARN
      description: The role to assume. Present when the instance lists who can connect.
      type: string
    browser_url:
      title: Browser URL
      description: opencode in the browser. Present when browser access is on.
      type: string
    preview_url:
      title: Preview URL
      description: The sandbox's dev server on its preview port. Present when browser access is on.
      type: string
    browser_username:
      title: Browser Username
      type: string
    browser_password:
      title: Browser Password
      description: Signs in to both the browser and preview URLs.
      type: string
      $md.sensitive: true
