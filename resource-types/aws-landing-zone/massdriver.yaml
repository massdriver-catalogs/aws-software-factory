name: aws-landing-zone
version: 0.0.0
label: AWS Landing Zone

ui:
  connectionOrientation: link

schema:
  title: AWS Landing Zone
  description: >-
    One team's slice of a shared VPC: public, private and internal subnets in every
    availability zone the VPC spans.
  type: object
  additionalProperties: false
  required:
    - name
    - region
    - vpc_id
    - vpc_cidr
    - cidr
    - shared_cidr
    - isolated
    - internet_egress
    - subnets
  properties:
    name:
      title: Name
      type: string
      minLength: 1
    region:
      title: Region
      type: string
      minLength: 1
    vpc_id:
      title: VPC ID
      type: string
      pattern: ^vpc-[a-f0-9]+$
    vpc_cidr:
      title: VPC CIDR
      type: string
    cidr:
      title: CIDR
      description: The range this landing zone owns.
      type: string
    shared_cidr:
      title: Shared CIDR
      description: The VPC's shared range, where shared services such as the model gateway run.
      type: string
    isolated:
      title: Isolated
      description: When true, network ACLs block traffic to and from other landing zones.
      type: boolean
    internet_egress:
      title: Internet Egress
      description: Whether private subnets have a route to the internet.
      type: boolean
    subnets:
      title: Subnets
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - cidr
          - availability_zone_id
          - tier
        properties:
          id:
            type: string
          cidr:
            type: string
          availability_zone_id:
            type: string
          tier:
            description: >-
              public routes to the internet gateway, private routes out through the VPC's egress,
              internal has no route out of the VPC.
            type: string
            enum:
              - public
              - private
              - internal
