name: github-actions-oidc
description: >-
  Lets GitHub Actions workflows in this AWS account get short-lived credentials instead of stored
  access keys. Deploy once per account; every repository's push role trusts it.
source_url: https://github.com/massdriver-catalogs/aws-software-factory/tree/main/bundles/github-actions-oidc
version: 0.0.0

params:
  examples:
    - __name: New account
      adopt_existing_provider: false
    - __name: Provider already exists
      adopt_existing_provider: true
  properties:
    adopt_existing_provider:
      title: Adopt the existing provider
      description: >-
        An AWS account holds one GitHub Actions OIDC provider. Turn this on when it already exists,
        for example created by hand or by another tool, to manage it here instead of failing to
        create a second. Only the first deploy reads this.
      type: boolean
      default: false
      $md.immutable: true

dependencies:
  aws_authentication:
    resource_type: aws-iam-role@0.0.0
    required: true

resources:
  oidc:
    resource_type: aws-github-oidc@0.0.0
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - "*"
