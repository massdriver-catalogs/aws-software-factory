name: aws-vpc
version: 0.0.0
label: AWS VPC

ui:
  connectionOrientation: environmentDefault
  environmentDefaultGroup: networks

schema:
  title: AWS VPC
  description: >-
    A VPC shared by every project. Workloads go in its public, private or internal subnets and
    are kept apart by their own security groups.
  type: object
  additionalProperties: false
  required:
    - id
    - region
    - cidr
    - availability_zones
    - subnets
    - internet_egress
  properties:
    id:
      title: VPC ID
      type: string
      pattern: ^vpc-[a-f0-9]+$
    region:
      title: Region
      type: string
      minLength: 1
    cidr:
      title: CIDR
      type: string
    availability_zones:
      title: Availability Zones
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - name
        properties:
          id:
            title: Zone ID
            description: Physical zone ID (e.g. use1-az1). The same in every account.
            type: string
          name:
            title: Zone Name
            description: This account's name for the zone (e.g. us-east-1a).
            type: string
    subnets:
      title: Subnets
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - cidr
          - availability_zone_id
          - tier
        properties:
          id:
            type: string
          cidr:
            type: string
          availability_zone_id:
            type: string
          tier:
            description: >-
              public routes to the internet gateway, private routes out through the VPC's egress,
              internal has no route out of the VPC.
            type: string
            enum:
              - public
              - private
              - internal
    internet_egress:
      title: Internet Egress
      description: Whether private subnets have a route to the internet.
      type: boolean
