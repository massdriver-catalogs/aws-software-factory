name: pollbox
description: >-
  Live polls. Create a poll with options, share its link, everyone votes once, and the results
  update as votes come in.
source_url: https://github.com/massdriver-catalogs/aws-software-factory/tree/main/applications/pollbox
version: 0.0.0

dependencies:
  polls:
    resource_type: aws-dynamodb-table@0.0.0
    required: true
  votes:
    resource_type: aws-dynamodb-table@0.0.0
    required: true

app:
  runtime: lambda-function
  envs:
    POLLS_TABLE: .dependencies.polls.name
    VOTES_TABLE: .dependencies.votes.name
