name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, factory]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review the change
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.request

          if not os.environ.get("OPENAI_BASE_URL"):
              sys.exit("This runner has no AI Platform access. Connect an LLM Endpoint to the runners and redeploy them.")

          diff = subprocess.run(
              ["git", "diff", "--unified=5", f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}"],
              capture_output=True, text=True, check=True,
          ).stdout
          if not diff.strip():
              print("Nothing to review."); sys.exit(0)

          limit = 120_000
          truncated = len(diff) > limit
          diff = diff[:limit]

          prompt = (
              "Review this pull request like a senior engineer on the team.\n"
              "Report only real problems: bugs, security issues, data loss, broken error handling, "
              "and changes that don't do what the title says. Skip style and nitpicks.\n"
              "For each problem give the file and line, what goes wrong, and the fix, as a short "
              "markdown bullet. If there are none, reply with exactly: No problems found.\n\n"
              f"Title: {os.environ.get('PR_TITLE', '')}\n"
              f"Description: {os.environ.get('PR_BODY') or '(none)'}\n\n"
              f"Diff{' (truncated)' if truncated else ''}:\n```diff\n{diff}\n```"
          )

          def call(url, payload, headers):
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers)
              with urllib.request.urlopen(req, timeout=600) as response:
                  return json.load(response)

          model = os.environ.get("OPENAI_MODEL", "")
          completion = call(
              os.environ["OPENAI_BASE_URL"].rstrip("/") + "/chat/completions",
              {"model": model, "messages": [{"role": "user", "content": prompt}], "max_tokens": 4000},
              {"Authorization": f"Bearer {os.environ['OPENAI_API_KEY']}", "Content-Type": "application/json"},
          )
          review = (completion["choices"][0]["message"].get("content") or "").strip() or "No problems found."

          body = f"### AI review ({model})\n\n{review}"
          if truncated:
              body += "\n\n_The diff was too long to review in full; only the first part was read._"

          call(
              f"https://api.github.com/repos/{os.environ['REPO']}/pulls/{os.environ['PR_NUMBER']}/reviews",
              {"commit_id": os.environ["HEAD_SHA"], "event": "COMMENT", "body": body},
              {
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          print(body)
          PY
