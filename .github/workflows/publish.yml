name: Publish

on:
  push:
    branches: [main]
    paths:
      - "platforms/**"
      - "resource-types/**"
      - "bundles/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      all:
        description: Publish everything, not just what changed
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MASSDRIVER_API_KEY: ${{ secrets.MASSDRIVER_API_KEY }}
      MASSDRIVER_ORG_ID: ${{ vars.MASSDRIVER_ORG_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Released builds lag main, and the catalog is developed against main.
      - name: Install mass from main
        run: |
          go install github.com/massdriver-cloud/mass@main
          mass version

      - name: Work out what changed
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          ALL: ${{ inputs.all }}
        run: |
          if [ "$ALL" = "true" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > changed.txt
          else
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > changed.txt
          fi
          # A workflow change republishes everything so a fixed pipeline catches up.
          if grep -qx '.github/workflows/publish.yml' changed.txt; then
            git ls-files > changed.txt
          fi
          for kind in platforms resource-types bundles; do
            awk -F/ -v k="$kind" '$1 == k && NF > 2 { print $1 "/" $2 }' changed.txt | sort -u > "$kind.txt"
            echo "$kind:"; sed 's/^/  /' "$kind.txt"
          done

      # Order matters: bundles reference resource types, which must already exist.
      - name: Publish platforms and resource types
        run: |
          set -euo pipefail
          for dir in $(cat platforms.txt resource-types.txt); do
            [ -f "$dir/massdriver.yaml" ] || continue
            name=$(awk '/^name:/ { print $2; exit }' "$dir/massdriver.yaml")
            mass repository create "$name" -t resource-type >/dev/null 2>&1 || true
            mass resource-type publish "$dir"
          done

      - name: Publish bundles
        run: |
          set -euo pipefail
          for dir in $(cat bundles.txt); do
            [ -f "$dir/massdriver.yaml" ] || continue
            name=$(awk '/^name:/ { print $2; exit }' "$dir/massdriver.yaml")
            mass repository create "$name" -t bundle >/dev/null 2>&1 || true
            mass bundle publish --bundle-directory "$dir"
          done
