name: landing-zone
description: >-
  Gives a team its own /20 of a shared VPC, with public, private and internal subnets in every
  availability zone the VPC spans. Sandboxes, models and apps connect here instead of to the VPC.
source_url: https://github.com/massdriver-catalogs/aws-software-factory/tree/main/bundles/landing-zone
version: 0.0.0

params:
  examples:
    - __name: Isolated team
      isolated: true
    - __name: Open to other teams
      isolated: false
  required:
    - range
    - isolated
  properties:
    range:
      title: CIDR
      description: >-
        A /20 of the VPC that no other landing zone holds. Claiming one already in use fails when
        the subnets are created.
      type: string
      $md.immutable: true
      $md.enum:
        connection: network
        options: .landing_zone_ranges
    isolated:
      title: Block traffic from other landing zones
      description: >-
        Network ACLs drop traffic between this landing zone and every other one. The VPC's shared
        services and the internet stay reachable. Security groups still apply either way.
      type: boolean
      default: true

dependencies:
  aws_authentication:
    resource_type: aws-iam-role@0.0.0
    required: true
  network:
    resource_type: aws-vpc@0.0.0
    required: true

resources:
  landing_zone:
    resource_type: aws-landing-zone@0.0.0
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - range
    - isolated
    - "*"
