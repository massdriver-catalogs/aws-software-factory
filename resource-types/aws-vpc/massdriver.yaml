name: aws-vpc
version: 0.0.0
label: AWS VPC

ui:
  connectionOrientation: environmentDefault
  environmentDefaultGroup: networks

schema:
  title: AWS VPC
  description: >-
    A shared VPC. It owns the internet gateway, egress, VPC endpoints and the route tables;
    landing zones carve their own subnets out of it.
  type: object
  additionalProperties: false
  required:
    - id
    - region
    - cidr
    - shared_cidr
    - availability_zones
    - landing_zone_ranges
    - route_tables
    - subnets
    - internet_egress
  properties:
    id:
      title: VPC ID
      type: string
      pattern: ^vpc-[a-f0-9]+$
    region:
      title: Region
      type: string
      minLength: 1
    cidr:
      title: CIDR
      type: string
    shared_cidr:
      title: Shared CIDR
      description: Range reserved for the VPC's own subnets — NAT, VPC endpoints and shared services.
      type: string
    availability_zones:
      title: Availability Zones
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - name
        properties:
          id:
            title: Zone ID
            description: Physical zone ID (e.g. use1-az1). The same in every account.
            type: string
          name:
            title: Zone Name
            description: This account's name for the zone (e.g. us-east-1a).
            type: string
    landing_zone_ranges:
      title: Landing Zone Ranges
      description: The /20 ranges landing zones may claim.
      type: array
      items:
        type: string
    route_tables:
      title: Route Tables
      type: object
      additionalProperties: false
      required:
        - public
        - private
        - internal
      properties:
        public:
          title: Public
          description: Default route to the internet gateway.
          type: string
        internal:
          title: Internal
          description: No route out of the VPC.
          type: string
        private:
          title: Private
          description: One per availability zone, default route through that zone's egress.
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - availability_zone_id
              - id
            properties:
              availability_zone_id:
                type: string
              id:
                type: string
    subnets:
      title: Shared Subnets
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - cidr
          - availability_zone_id
          - tier
        properties:
          id:
            type: string
          cidr:
            type: string
          availability_zone_id:
            type: string
          tier:
            type: string
            enum:
              - public
              - private
    internet_egress:
      title: Internet Egress
      description: Whether private subnets have a route to the internet.
      type: boolean
