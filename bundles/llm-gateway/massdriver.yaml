name: llm-gateway
description: >-
  The single front door to every model on the AI Platform. Sandboxes, runners and apps call one
  OpenAI-compatible URL with their own key; the gateway routes to Bedrock or to a self-hosted
  model server, and is the only thing allowed to reach either.
source_url: https://github.com/massdriver-catalogs/aws-software-factory/tree/main/bundles/llm-gateway
version: 0.0.0

params:
  examples:
    - __name: Lowest cost
      monthly_budget: 40
      bedrock_models: [kimi-k2-5, gpt-oss-20b]
      log_retention_days: 1
      monthly_budget_usd: 10
      budget_overrides: []
    - __name: Demo
      monthly_budget: 80
      bedrock_models: [kimi-k2-5, kimi-k3]
      log_retention_days: 1
      monthly_budget_usd: 50
      budget_overrides: []
    - __name: Development
      monthly_budget: 40
      bedrock_models: [kimi-k2-5]
      log_retention_days: 1
      monthly_budget_usd: 20
      budget_overrides: []
    - __name: Production
      monthly_budget: 150
      bedrock_models: [kimi-k2-5, kimi-k3, qwen3-coder-next]
      log_retention_days: 30
      monthly_budget_usd: 100
      budget_overrides: []
  required:
    - bedrock_models
    - log_retention_days
    - monthly_budget_usd
    - budget_overrides
  properties:
    monthly_budget:
      title: Monthly budget (USD)
      description: >-
        What this instance should cost in a month. When Massdriver's cost data goes over it, a
        cheaper configuration is proposed for review.
      type: number
      minimum: 0
      default: 40
    bedrock_models:
      title: Bedrock models
      description: >-
        Open-weight models served by Bedrock, billed per token. Kimi K2.5 is the default whenever it's ticked; otherwise the first one. A
        connected model server is added alongside these. ***Bigger models cost more per token.***
      type: array
      uniqueItems: true
      default:
        - kimi-k2-5
        - kimi-k3
      items:
        type: string
        oneOf:
          - const: kimi-k2-5
            title: Kimi K2.5 — strong coding agent, ~$0.60 in / $3 out per M tokens
          - const: kimi-k3
            title: Kimi K3 — best for coding agents, ~$3.30 in / $16.50 out per M tokens
          - const: qwen3-coder-next
            title: Qwen3 Coder Next — coding-tuned
          - const: gpt-oss-120b
            title: gpt-oss-120b — cheap, weaker at agentic coding
          - const: gpt-oss-20b
            title: gpt-oss-20b — cheapest, weakest at agentic coding
    log_retention_days:
      title: Log retention (days)
      description: Request logs from the gateway. ***CloudWatch bills per GB stored.***
      type: integer
      default: 1
      enum:
        - 1
        - 7
        - 30
        - 90

    monthly_budget_usd:
      title: Monthly budget per consumer (USD)
      description: >-
        ***Caps token spend per sandbox, runner or app.*** Once a consumer's estimated Bedrock spend
        for the calendar month reaches this, the gateway answers it with 429 until the 1st. 0 means
        no limit. The self-hosted model doesn't count; its GPU is billed by the hour.
      type: number
      default: 20
      minimum: 0
    budget_overrides:
      title: Budget overrides
      description: >-
        A different monthly budget for specific consumers. The consumer name is the sandbox's or
        app's instance name, e.g. `devsandboxes-cory-sandbox`.
      type: array
      default: []
      items:
        type: object
        required:
          - consumer
          - monthly_budget_usd
        properties:
          consumer:
            title: Consumer
            type: string
            pattern: ^[a-z0-9-]+$
          monthly_budget_usd:
            title: Monthly budget (USD)
            description: 0 means no limit.
            type: number
            minimum: 0

dependencies:
  aws_authentication:
    resource_type: aws-iam-role@0.0.0
    required: true
  network:
    resource_type: aws-vpc@0.0.0
    required: true
  model_server:
    resource_type: model-server@0.0.0
    required: false

resources:
  endpoint:
    resource_type: llm-endpoint@0.0.0
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - bedrock_models
    - monthly_budget_usd
    - budget_overrides
    - log_retention_days
    - "*"
  bedrock_models:
    ui:widget: checkboxes
