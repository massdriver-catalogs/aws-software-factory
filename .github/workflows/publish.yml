name: Publish

on:
  push:
    branches: [main]
    paths:
      - "platforms/**"
      - "resource-types/**"
      - "bundles/**"
      - "applications/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      all:
        description: Publish everything, not just what changed
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MASSDRIVER_API_KEY: ${{ secrets.MASSDRIVER_API_KEY }}
      MASSDRIVER_ORG_ID: ${{ vars.MASSDRIVER_ORG_ID || secrets.MASSDRIVER_ORG_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Released builds lag main, and the catalog is developed against main.
      - name: Install mass from main
        run: |
          go install github.com/massdriver-cloud/mass@main
          mass version

      - name: Work out what changed
        id: changed
        env:
          ALL: ${{ inputs.all }}
          GH_TOKEN: ${{ github.token }}
        # Diff against the last successful publish, not the previous push: when pushes
        # land close together GitHub drops queued runs, and their changes would be skipped.
        run: |
          BASE=$(gh run list --workflow publish.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ "$ALL" = "true" ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git ls-files > changed.txt
          else
            git diff --name-only "$BASE" "$GITHUB_SHA" > changed.txt
          fi
          # A workflow change republishes everything so a fixed pipeline catches up.
          if grep -qx '.github/workflows/publish.yml' changed.txt; then
            git ls-files > changed.txt
          fi
          for kind in platforms resource-types bundles applications; do
            awk -F/ -v k="$kind" '$1 == k && NF > 2 { print $1 "/" $2 }' changed.txt | sort -u > "$kind.txt"
            echo "$kind:"; sed 's/^/  /' "$kind.txt"
          done
          # Applications are built on a runtime bundle, so a bundle change rebuilds every one.
          if [ -s bundles.txt ]; then
            git ls-files 'applications/*/massdriver.yaml' | xargs -r -n1 dirname > applications.txt
          fi

      # Order matters: bundles reference resource types, which must already exist.
      - name: Publish platforms and resource types
        run: |
          set -euo pipefail
          for dir in $(cat platforms.txt resource-types.txt); do
            [ -f "$dir/massdriver.yaml" ] || continue
            name=$(awk '/^name:/ { print $2; exit }' "$dir/massdriver.yaml")
            mass repository create "$name" -t resource-type >/dev/null 2>&1 || true
            mass resource-type publish "$dir"
          done

      - name: Publish bundles
        run: |
          set -euo pipefail
          for dir in $(cat bundles.txt applications.txt); do
            [ -f "$dir/massdriver.yaml" ] || continue
            name=$(awk '/^name:/ { print $2; exit }' "$dir/massdriver.yaml")
            mass repository create "$name" -t bundle >/dev/null 2>&1 || true
            mass bundle publish --bundle-directory "$dir"
          done
