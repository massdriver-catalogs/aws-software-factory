name: budget-guard
description: >-
  A monthly spending limit for the whole AWS account, with alerts as actual and forecast spend
  approach it. Deploy once per account.
source_url: https://github.com/massdriver-catalogs/aws-software-factory/tree/main/bundles/budget-guard
version: 0.0.0

params:
  examples:
    - __name: Workshop
      monthly_limit_usd: 25
      alert_at_percent: [50, 80, 100]
      alert_on_forecast: true
      alert_emails: []
    - __name: Team account
      monthly_limit_usd: 1000
      alert_at_percent: [80, 100]
      alert_on_forecast: true
      alert_emails: []
  required:
    - monthly_limit_usd
    - alert_at_percent
    - alert_on_forecast
    - alert_emails
  properties:
    monthly_limit_usd:
      title: Monthly limit (USD)
      description: >-
        Spend for the whole account in a calendar month, all services. Alerts only; nothing is
        stopped when it's reached.
      type: integer
      default: 25
      minimum: 1
    alert_at_percent:
      title: Alert at (% of limit, actual spend)
      type: array
      uniqueItems: true
      minItems: 1
      default: [50, 80, 100]
      items:
        type: integer
        enum: [25, 50, 80, 90, 100, 120]
    alert_on_forecast:
      title: Alert when the month is forecast to go over
      description: Warns before the money is spent, based on the month's run rate so far.
      type: boolean
      default: true
    alert_emails:
      title: Email alerts to
      description: >-
        Optional. Alerts always go to this bundle's SNS topic; add addresses here to get them by
        email too.
      type: array
      uniqueItems: true
      maxItems: 10
      default: []
      items:
        type: string
        format: email

dependencies:
  aws_authentication:
    resource_type: aws-iam-role@0.0.0
    required: true

resources: {}

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - monthly_limit_usd
    - alert_at_percent
    - alert_on_forecast
    - alert_emails
    - "*"
  monthly_limit_usd:
    ui:widget: updown
  alert_at_percent:
    ui:widget: checkboxes
